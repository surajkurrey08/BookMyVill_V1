apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner
  labels:
    app.kubernetes.io/name: owner
    app.kubernetes.io/part-of: bookmyvilla
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: owner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owner
        app.kubernetes.io/part-of: bookmyvilla
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: owner
          image: "bookmyvilla/owner:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
