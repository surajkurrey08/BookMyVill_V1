name: Deploy Lonavala.fun

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 1.5 Diagnostic Secrets Check ──────────────────────────────────────
      - name: Diagnostic Secrets Check
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then echo "VPS_SSH_KEY is empty"; else echo "VPS_SSH_KEY is present"; fi
          if [ -z "$VPS_HOST" ]; then echo "VPS_HOST is empty"; else echo "VPS_HOST is present"; fi
          if [ -z "$VPS_USER" ]; then echo "VPS_USER is empty"; else echo "VPS_USER is present"; fi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}

      # ── 2. Node.js ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      # ── 3. Frontend Build (Main Site & Users Portal) ──────────────────────────
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.lonavala.fun

      # ── 3.4 Owner Build ───────────────────────────────────────────────────
      - name: Install Owner Dependencies
        working-directory: owner
        run: npm install

      - name: Build Owner
        working-directory: owner
        run: npm run build
        env:
          VITE_API_URL: https://api.lonavala.fun

      # ── 3.5 Caretaker Build ───────────────────────────────────────────────
      - name: Install Caretaker Dependencies
        working-directory: caretaker
        run: npm install

      - name: Build Caretaker
        working-directory: caretaker
        run: npm run build
        env:
          VITE_API_URL: https://api.lonavala.fun

      # ── 3.6 Admin Build ───────────────────────────────────────────────────
      - name: Install Admin Dependencies
        working-directory: admin
        run: npm install

      - name: Build Admin
        working-directory: admin
        run: npm run build
        env:
          VITE_API_URL: https://api.lonavala.fun

      # ── 4. Package Backend ────────────────────────────────────────────────
      - name: Package Backend
        run: |
          tar -czf backend.tar.gz \
            --exclude=backend/node_modules \
            --exclude=backend/.env \
            --exclude=backend/*.log \
            backend/

      # ── 5. SSH Setup ──────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ── 6. VPS - Ensure directories and tools exist ───────────────────────
      - name: VPS Prerequisites
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'SSH_EOF'
            set -e
            mkdir -p /var/www/lonavala.fun/frontend \
                     /var/www/lonavala.fun/users \
                     /var/www/lonavala.fun/owner \
                     /var/www/lonavala.fun/caretaker \
                     /var/www/lonavala.fun/admin \
                     /var/www/lonavala.fun/backend \
                     /var/www/certbot
            command -v node || (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs)
            command -v pm2 || npm install -g pm2
            command -v nginx || (apt-get update -qq && apt-get install -y nginx)
            command -v certbot || (apt-get update -qq && apt-get install -y certbot python3-certbot-nginx)
            echo 'Prerequisites done'
          SSH_EOF

      # ── 7. Write Nginx Config on VPS ──────────────────────────────────────
      - name: Configure Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'SSH_EOF'
            set -e
            mkdir -p /var/www/certbot \
                     /var/www/lonavala.fun/frontend \
                     /var/www/lonavala.fun/users \
                     /var/www/lonavala.fun/owner \
                     /var/www/lonavala.fun/caretaker \
                     /var/www/lonavala.fun/admin

            # 1. Clean up duplicate/conflicting configs
            rm -f /etc/nginx/sites-enabled/admin.lonavala.fun
            rm -f /etc/nginx/sites-available/admin.lonavala.fun
            rm -f /etc/nginx/sites-enabled/default

            # 2. Complete HTTP & HTTPS Nginx config for all subdomains
            cat > /etc/nginx/sites-available/lonavala.fun << 'EOF'
# ==============================================================================
# HTTP SERVER BLOCKS (Port 80)
# ==============================================================================

# Main Tourist Site & Users (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name lonavala.fun www.lonavala.fun users.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/lonavala.fun/frontend;
    index index.html;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    location /owner/ {
        alias /var/www/lonavala.fun/owner/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /owner/index.html;
    }
    location /caretaker/ {
        alias /var/www/lonavala.fun/caretaker/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /caretaker/index.html;
    }
    location /admin/ {
        alias /var/www/lonavala.fun/admin/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Property Owner Subdomain (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name owner.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/lonavala.fun/owner;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Caretaker Subdomain (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name caretaker.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/lonavala.fun/caretaker;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Admin Subdomain (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name admin.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/lonavala.fun/admin;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Backend API Proxy Subdomain (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name api.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# HTTPS SERVER BLOCKS (Port 443) - Used when SSL Certificates are present
# ==============================================================================

# Main Tourist Site & Users (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lonavala.fun www.lonavala.fun users.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lonavala.fun/frontend;
    index index.html;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    location /owner/ {
        alias /var/www/lonavala.fun/owner/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /owner/index.html;
    }
    location /caretaker/ {
        alias /var/www/lonavala.fun/caretaker/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /caretaker/index.html;
    }
    location /admin/ {
        alias /var/www/lonavala.fun/admin/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Property Owner Subdomain (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name owner.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lonavala.fun/owner;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Caretaker Subdomain (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caretaker.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lonavala.fun/caretaker;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Admin Subdomain (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lonavala.fun/admin;
    index index.html;
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Backend API Proxy Subdomain (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOF

            ln -sf /etc/nginx/sites-available/lonavala.fun /etc/nginx/sites-enabled/lonavala.fun

            # 3. Fallback self-signed cert if certbot has not generated one yet
            if [ ! -f /etc/letsencrypt/live/lonavala.fun/fullchain.pem ]; then
              mkdir -p /etc/letsencrypt/live/lonavala.fun
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/letsencrypt/live/lonavala.fun/privkey.pem \
                -out /etc/letsencrypt/live/lonavala.fun/fullchain.pem \
                -subj '/CN=lonavala.fun' || true
            fi

            # 4. Attempt Certbot SSL Certificate Generation
            certbot certonly --webroot -w /var/www/certbot \
              -d lonavala.fun \
              -d www.lonavala.fun \
              -d users.lonavala.fun \
              -d owner.lonavala.fun \
              -d caretaker.lonavala.fun \
              -d admin.lonavala.fun \
              -d api.lonavala.fun \
              --email admin@lonavala.fun \
              --agree-tos \
              --expand \
              --non-interactive || true

            nginx -t && (systemctl reload nginx || systemctl restart nginx || systemctl start nginx)
            echo 'Nginx configured successfully for all subdomains!'
          SSH_EOF

      # ── 7.5 Debug Nginx VPS ───────────────────────────────────────────────
      - name: Debug Nginx VPS
        if: always()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'SSH_EOF'
            echo '=== Nginx Config Files ===' > /tmp/vps_debug.txt
            ls -la /etc/nginx/sites-enabled/ >> /tmp/vps_debug.txt
            echo '=== Content of /etc/nginx/sites-enabled/lonavala.fun ===' >> /tmp/vps_debug.txt
            cat /etc/nginx/sites-enabled/lonavala.fun >> /tmp/vps_debug.txt
            echo '=== Directory structure of /var/www/lonavala.fun ===' >> /tmp/vps_debug.txt
            ls -R /var/www/lonavala.fun >> /tmp/vps_debug.txt
          SSH_EOF
          scp ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/vps_debug.txt ./vps_debug.txt || true
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add vps_debug.txt || true
          git commit -m "debug: save vps debug info [skip ci]" || true
          git push origin main || true

      # ── 8. Deploy Frontend (Main Site & Users Subdomain) ─────────────────
      - name: Deploy Frontend
        run: |
          rsync -az --delete \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/lonavala.fun/frontend/

      # ── 8.2 Deploy Owner ──────────────────────────────────────────────────
      - name: Deploy Owner
        run: |
          rsync -az --delete \
            owner/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/lonavala.fun/owner/

      # ── 8.3 Deploy Caretaker ──────────────────────────────────────────────
      - name: Deploy Caretaker
        run: |
          rsync -az --delete \
            caretaker/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/lonavala.fun/caretaker/

      # ── 8.5 Deploy Admin ──────────────────────────────────────────────────
      - name: Deploy Admin
        run: |
          rsync -az --delete \
            admin/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/lonavala.fun/admin/

      # ── 9. Deploy Backend ─────────────────────────────────────────────────
      - name: Deploy Backend
        run: |
          scp backend.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/backend.tar.gz

      # ── 10. Extract & Restart Backend ─────────────────────────────────────
      - name: Restart Backend
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'SSH_EOF'
            set -e
            cd /var/www/lonavala.fun/backend
            tar -xzf /tmp/backend.tar.gz --strip-components=1 -C .
            rm -f /tmp/backend.tar.gz
            npm install --omit=dev
            pm2 restart lonavala-backend 2>/dev/null || pm2 start index.js --name lonavala-backend
            pm2 save
            pm2 list
            echo 'Backend deployed!'
          SSH_EOF

      # ── 11. Health Check ──────────────────────────────────────────────────
      - name: Health Check
        run: |
          sleep 5
          curl -so /dev/null -w "lonavala.fun HTTP %{http_code}\n" http://lonavala.fun || true
          curl -so /dev/null -w "users.lonavala.fun HTTP %{http_code}\n" http://users.lonavala.fun || true
          curl -so /dev/null -w "owner.lonavala.fun HTTP %{http_code}\n" http://owner.lonavala.fun || true
          curl -so /dev/null -w "caretaker.lonavala.fun HTTP %{http_code}\n" http://caretaker.lonavala.fun || true
          curl -so /dev/null -w "admin.lonavala.fun HTTP %{http_code}\n" http://admin.lonavala.fun || true
          curl -so /dev/null -w "api.lonavala.fun HTTP %{http_code}\n" http://api.lonavala.fun || true