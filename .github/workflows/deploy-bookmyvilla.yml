name: Deploy BookMyVilla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookmyvilla-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      # ============================================================
      # 1. Checkout source code
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Validate deployment secrets
      # ============================================================

      - name: Check deployment settings
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS BACKEND_ENV; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing in GitHub repository secrets"
              exit 1
            fi
          done

          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS_PORT must be numeric"
            exit 1
          fi

          if (( 10#$VPS_PORT < 1 || 10#$VPS_PORT > 65535 )); then
            echo "::error::VPS_PORT must be between 1 and 65535"
            exit 1
          fi

          if [[ "$VPS_HOST" != 31.97.61.172 ]]; then
            echo "::error::VPS_HOST does not match the configured production VPS"
            exit 1
          fi

          if [[ "$VPS_USER" != root ]]; then
            echo "::error::VPS_USER must be root for Nginx and certificate setup"
            exit 1
          fi

          if [[ -n "$CERTBOT_EMAIL" && ! "$CERTBOT_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]]; then
            echo "::error::CERTBOT_EMAIL must be a valid email address"
            exit 1
          fi

          echo "Deployment configuration OK"

      # ============================================================
      # 3. Setup Node
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json
            owner/package-lock.json
            caretaker/package-lock.json
            data-entry/package-lock.json
            villa-manager/package-lock.json

      # ============================================================
      # 4. Verify frontend builds
      # ============================================================

      - name: Verify frontend builds
        env:
          VITE_API_URL: https://api.bookmyvilla.online
          VITE_API_BASE_URL: https://api.bookmyvilla.online/api
          VITE_GUEST_SITE_URL: https://bookmyvilla.online
          VITE_OWNER_PORTAL_URL: https://owner.bookmyvilla.online
          VITE_ADMIN_PORTAL_URL: https://admin.bookmyvilla.online
          VITE_OWNER_APP_URL: https://bookmyvilla.online
        run: |
          set -euo pipefail

          for app in frontend admin owner caretaker data-entry villa-manager; do
            echo ""
            echo "======================================"
            echo "Building $app"
            echo "======================================"

            cd "$GITHUB_WORKSPACE/$app"

            npm ci
            npm run build
          done

          echo ""
          echo "All frontend builds passed"

      # ============================================================
      # 5. Configure SSH
      # ============================================================

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          umask 077

          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host bookmyvilla-vps
            HostName ${VPS_HOST}
            Port ${VPS_PORT}
            User ${VPS_USER}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

          if ! ssh_output=$(
            ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              bookmyvilla-vps \
              'echo "SSH connection ready"' \
              2>&1
          ); then

            ssh_error=${ssh_output//$'\r'/}
            ssh_error=${ssh_error//$'\n'/'; '}
            ssh_error=${ssh_error//%/%25}

            echo "::error title=VPS SSH connection failed::$ssh_error"

            exit 1
          fi

          printf '%s\n' "$ssh_output"

      # ============================================================
      # 6. Verify Docker on VPS. Public Nginx is configured after the
      # containers and production builds pass their local checks.
      # ============================================================

      - name: Check VPS Docker
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker is not installed"
              exit 1
            fi

            docker --version

            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: Docker Compose plugin is unavailable"
              exit 1
            fi

            docker compose version

            echo ""
            echo "Existing running containers:"
            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "Docker check completed"
          REMOTE

      # ============================================================
      # 7. Prepare only BookMyVilla directory
      # ============================================================

      - name: Prepare BookMyVilla directory
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            mkdir -p /var/www/bookmyvilla
            mkdir -p /var/www/bookmyvilla/backend
            mkdir -p /var/www/bookmyvilla/backend/uploads

            echo "BookMyVilla deployment directory ready"
          REMOTE

      # ============================================================
      # 8. Upload source
      #
      # .env is excluded because it will come from GitHub Secrets.
      # uploads directory is preserved.
      # ============================================================

      - name: Upload BookMyVilla application
        run: |
          set -euo pipefail

          rsync \
            -az \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='*/node_modules/' \
            --exclude='dist/' \
            --exclude='*/dist/' \
            --exclude='.env' \
            --exclude='*/.env' \
            --exclude='backend/uploads/' \
            --exclude='*.log' \
            ./ \
            bookmyvilla-vps:/var/www/bookmyvilla/

          echo "BookMyVilla source uploaded"

      - name: Upload production frontend builds
        run: |
          set -euo pipefail

          for app in frontend admin owner data-entry villa-manager; do
            rsync -az --delete \
              "$GITHUB_WORKSPACE/$app/dist/" \
              "bookmyvilla-vps:/var/www/bookmyvilla/$app/dist/"
          done

          echo "Guest, admin, owner, data entry and villa manager production builds uploaded"

      # ============================================================
      # 9. Create backend/.env automatically from GitHub Secret
      # ============================================================

      - name: Create backend production environment
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -euo pipefail

          if [[ -z "$BACKEND_ENV" ]]; then
            echo "::error::BACKEND_ENV GitHub secret is missing"
            exit 1
          fi

          ENV_TEMP="$RUNNER_TEMP/bookmyvilla-backend.env"

          printf '%s' "$BACKEND_ENV" > "$ENV_TEMP"

          scp \
            "$ENV_TEMP" \
            bookmyvilla-vps:/var/www/bookmyvilla/backend/.env

          ssh bookmyvilla-vps \
            'chmod 600 /var/www/bookmyvilla/backend/.env'

          rm -f "$ENV_TEMP"

          echo "Backend production environment created"

      # ============================================================
      # 10. Verify backend .env
      #
      # Secret values are NOT printed.
      # ============================================================

      - name: Verify backend environment
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            ENV_FILE="/var/www/bookmyvilla/backend/.env"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: backend/.env was not created"
              exit 1
            fi

            if [ ! -s "$ENV_FILE" ]; then
              echo "ERROR: backend/.env is empty"
              exit 1
            fi

            echo "backend/.env exists"

            if grep -Eq '^(MONGO_URI|MONGODB_URI|MONGO_URL)=' "$ENV_FILE"; then
              echo "MongoDB configuration found"
            else
              echo "WARNING: MongoDB variable not detected"
            fi

            chmod 600 "$ENV_FILE"

            echo "Environment verification completed"
          REMOTE

      # ============================================================
      # 11. Validate docker-compose.yaml
      # ============================================================

      - name: Validate Docker Compose
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            echo "Validating Docker Compose configuration..."

            docker compose config >/dev/null

            echo "Docker Compose configuration valid"
          REMOTE

      # ============================================================
      # 12. Build ONLY BookMyVilla containers
      # ============================================================

      - name: Build BookMyVilla containers
        run: |
          set -euo pipefail

          if ! ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            echo ""
            echo "======================================"
            echo "Building BookMyVilla containers"
            echo "======================================"

            docker compose build --pull

          REMOTE
          then

            echo "::error title=BookMyVilla build failed::Docker build failed"

            ssh bookmyvilla-vps <<'REMOTE'
              cd /var/www/bookmyvilla || exit 0

              docker compose ps || true
              docker compose logs --tail=100 || true
          REMOTE

            exit 1
          fi

      # ============================================================
      # 13. Start/update ONLY BookMyVilla
      #
      # docker compose down is intentionally NOT used.
      # Other VPS containers are untouched.
      # ============================================================

      - name: Start BookMyVilla containers
        run: |
          set -euo pipefail

          if ! ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            echo ""
            echo "======================================"
            echo "Starting BookMyVilla"
            echo "======================================"

            docker compose up -d --remove-orphans

            echo ""
            echo "BookMyVilla container status:"

            docker compose ps

          REMOTE
          then

            echo "::error title=BookMyVilla startup failed::Containers could not start"

            ssh bookmyvilla-vps <<'REMOTE'
              cd /var/www/bookmyvilla || exit 0

              echo ""
              echo "Container status:"
              docker compose ps || true

              echo ""
              echo "Container logs:"
              docker compose logs --tail=150 || true
          REMOTE

            exit 1
          fi

      # ============================================================
      # 14. Wait for startup
      # ============================================================

      - name: Wait for services
        run: |
          echo "Waiting for BookMyVilla services..."
          sleep 10

      # ============================================================
      # 15. Check backend
      # ============================================================

      - name: Check backend
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            echo "Checking backend on port 5001..."

            success=false

            for attempt in $(seq 1 12); do

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                http://127.0.0.1:5001/api/health \
                >/dev/null
              then

                echo "Backend healthy"
                success=true
                break
              fi

              echo "Backend not ready - attempt ${attempt}/12"

              sleep 5
            done

            if [ "$success" != "true" ]; then

              echo ""
              echo "ERROR: Backend health check failed"

              echo ""
              echo "Container status:"
              docker compose ps

              echo ""
              echo "Backend logs:"
              docker compose logs --tail=150 backend

              exit 1
            fi
          REMOTE

      # ============================================================
      # 16. Check frontend/admin/owner/caretaker
      # ============================================================

      - name: Check frontend applications
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            check_service() {

              NAME="$1"
              PORT="$2"

              echo ""
              echo "Checking ${NAME} on port ${PORT}..."

              SUCCESS=false

              for attempt in $(seq 1 10); do

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 10 \
                  "http://127.0.0.1:${PORT}/" \
                  >/dev/null
                then

                  echo "${NAME}: healthy"

                  SUCCESS=true
                  break
                fi

                echo "${NAME}: waiting (${attempt}/10)"

                sleep 3
              done

              if [ "$SUCCESS" != "true" ]; then

                echo ""
                echo "ERROR: ${NAME} health check failed"

                echo ""
                docker compose ps

                echo ""
                docker compose logs --tail=100

                exit 1
              fi
            }

            check_service "Frontend" 5173
            check_service "Admin" 5174
            check_service "Owner" 5175
            check_service "Caretaker" 5176

          REMOTE

      - name: Configure public Nginx and TLS
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps \
            "VPS_HOST='$VPS_HOST' CERTBOT_EMAIL='$CERTBOT_EMAIL' bash /var/www/bookmyvilla/scripts/configure-public-site.sh"

      - name: Check public website
        run: |
          set -euo pipefail

          check_page() {
            local url="$1" title="$2" response
            response=$(curl --fail --silent --show-error --max-time 15 "$url")
            if [[ "$response" != *"<title>$title</title>"* || "$response" != *'/assets/'* ]]; then
              echo "::error::$url did not return the production build"
              exit 1
            fi
            echo "$url serves the production build"
          }

          check_page https://bookmyvilla.online/ 'BookMyVilla | Premium Hill Station Stays'
          check_page https://admin.bookmyvilla.online/ 'Mahabaleshwar Luxury | Admin Portal'

          if getent ahostsv4 owner.bookmyvilla.online >/dev/null; then
            check_page https://owner.bookmyvilla.online/ 'Property Owner Portal | Mahabaleshwar Luxury Stays'
          else
            echo '::warning::Owner portal public check skipped until its DNS A record exists.'
          fi

          for portal in dataentry villamanage; do
            if getent ahostsv4 "$portal.bookmyvilla.online" | awk -v expected="$VPS_HOST" '$1 == expected { found = 1 } END { exit !found }'; then
              if [[ "$portal" == dataentry ]]; then
                check_page https://dataentry.bookmyvilla.online/ 'BookMyVilla | Data Entry'
              else
                check_page https://villamanage.bookmyvilla.online/ 'Villa Manager | BookMyVilla'
              fi
            else
              echo "::warning::$portal public check skipped until its DNS A record points to this VPS."
            fi
          done

          health=$(curl --fail --silent --show-error --max-time 15 \
            https://api.bookmyvilla.online/api/health)
          if [[ "$health" != *'"status":"ok"'* ]]; then
            echo '::error::Public API health response was not healthy'
            exit 1
          fi
          echo 'Public API is healthy'

      # ============================================================
      # 17. Final deployment status
      # ============================================================

      - name: Deployment status
        run: |
          set -euo pipefail

          ssh bookmyvilla-vps <<'REMOTE'
            set -euo pipefail

            cd /var/www/bookmyvilla

            echo ""
            echo "======================================"
            echo " BOOKMYVILLA DEPLOYMENT SUCCESSFUL"
            echo "======================================"
            echo ""

            docker compose ps

            echo ""
            echo "BookMyVilla internal endpoints:"
            echo "--------------------------------------"
            echo "Frontend  : http://127.0.0.1:5173"
            echo "Admin     : http://127.0.0.1:5174"
            echo "Owner     : http://127.0.0.1:5175"
            echo "Caretaker : http://127.0.0.1:5176"
            echo "Backend   : http://127.0.0.1:5001"
            echo "--------------------------------------"

          REMOTE

      # ============================================================
      # 18. Cleanup unused Docker build images
      #
      # Running containers are NOT removed/stopped.
      # ============================================================

      - name: Clean unused Docker images
        if: success()
        run: |
          ssh bookmyvilla-vps \
            'docker image prune -f'
