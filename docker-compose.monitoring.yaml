# Optional monitoring stack. Start together with the main stack:
#   docker compose -f docker-compose.yaml -f docker-compose.monitoring.yaml up -d
# Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000 (admin / GRAFANA_ADMIN_PASSWORD)
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bookmyvilla-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bookmyvilla-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - bookmyvilla-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bookmyvilla-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bookmyvilla-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - bookmyvilla-network

volumes:
  bookmyvilla-prometheus-data:
  bookmyvilla-grafana-data:
