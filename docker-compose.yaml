      timeout: 5s
      retries: 5
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bookmyvilla-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"   # management UI, local only
    volumes:
      - bookmyvilla-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - bookmyvilla-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: bookmyvilla-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - bookmyvilla-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: bookmyvilla-mongo
    restart: unless-stopped
    volumes:
      - bookmyvilla-mongo-data:/data/db
    networks:
      - bookmyvilla-network
    # mongosh is slow to cold-start on a loaded host; this only reports status.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s

  frontend:
