# Generated by infrastructure/scripts/generate-compose.js from backend/shared/serviceCatalog.js.
# Edit the catalog or the generator, then re-run it.
#
# Public backend entry: api-gateway on 127.0.0.1:2001 (host nginx -> api.bookmyvilla.online).
# The 12 microservices, RabbitMQ and Redis are reachable only on the internal network.
# Service-to-service /internal calls use INTERNAL_SERVICE_TOKEN from backend/.env.
name: bookmyvilla

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: bookmyvilla/backend:local
  env_file:
    - path: ./backend/.env
      required: true
  volumes:
    - ./backend/uploads:/app/uploads
  restart: unless-stopped
  networks:
    - bookmyvilla-network
  depends_on:
    - mongo
    - rabbitmq
    - redis

x-backend-env: &backend-env
  RABBITMQ_URL: amqp://rabbitmq:5672
  REDIS_URL: redis://redis:6379

services:
  api-gateway:
    <<: *backend
    container_name: bookmyvilla-api-gateway
    command: ["node", "api-gateway/src/server.js"]
    ports:
      - "127.0.0.1:2001:2001"
    environment:
      <<: *backend-env
      SERVICE_NAME: api-gateway
      PORT: "2001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service:
    <<: *backend
    container_name: bookmyvilla-auth-service
    command: ["node", "services/auth-service/src/server.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: auth-service
      PORT: "2101"
      # TEMPORARY for live testing: the sign-up/login OTP is shown on screen
      # instead of sent by SMS. Delete this line before real users sign up.
      ALLOW_DEMO_OTP: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  user-service:
    <<: *backend
    container_name: bookmyvilla-user-service
    command: ["node", "services/user-service/src/server.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: user-service
      PORT: "2102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  villa-service:
    <<: *backend
    container_name: bookmyvilla-villa-service
    command: ["node", "services/villa-service/src/server.js"]
    environment:
