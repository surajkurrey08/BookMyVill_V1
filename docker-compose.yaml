name: bookmyvilla

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bookmyvilla-backend

    ports:
      - "127.0.0.1:2001:2001"

    env_file:
      - path: ./backend/.env
        required: true

    environment:
      PORT: "2001"
      # TEMPORARY for live testing: the sign-up/login OTP is shown on screen
      # instead of sent by SMS. Delete this line before real users sign up.
      ALLOW_DEMO_OTP: "true"

    volumes:
      - ./backend/uploads:/app/uploads

    restart: unless-stopped

    # Start order only. Readiness is handled by the backend's own connection
    # retry loop and the deployment /api/health check, so a slow mongo health
    # probe can never block the stack from starting.
    depends_on:
      - mongo

    networks:
      - bookmyvilla-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: bookmyvilla-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - bookmyvilla-network


  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile

    container_name: bookmyvilla-admin

    ports:
      - "5174:5174"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - bookmyvilla-network


  owner:
    build:
      context: ./owner
      dockerfile: Dockerfile

    container_name: bookmyvilla-owner

    ports:
      - "5175:5175"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - bookmyvilla-network


  caretaker:
    build:
      context: ./caretaker
      dockerfile: Dockerfile

    container_name: bookmyvilla-caretaker

    ports:
      - "5176:5176"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - bookmyvilla-network


  mongo:
    image: mongo:7

    container_name: bookmyvilla-mongo

    restart: unless-stopped

    volumes:
      - bookmyvilla-mongo-data:/data/db

    networks:
      - bookmyvilla-network

    # mongosh is Node-based and slow to cold-start on a loaded host, so the
    # timeout and start_period are generous. This only reports status; it does
    # not gate the backend (see the backend depends_on note above).
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s


networks:
  bookmyvilla-network:
    driver: bridge

volumes:
  bookmyvilla-mongo-data:
