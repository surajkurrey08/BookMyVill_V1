# Installed as conf.d/bookmyvilla.conf inside the shared gateway container
# while the first TLS certificate is requested. __UPSTREAM__ is replaced with
# the host's Docker bridge address by scripts/configure-public-site.sh.
server {
    listen 80;
    server_name bookmyvilla.online api.bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online dataentry.bookmyvilla.online villamanage.bookmyvilla.online;

    client_max_body_size 55m;
    location / {
        proxy_pass http://__UPSTREAM__:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
