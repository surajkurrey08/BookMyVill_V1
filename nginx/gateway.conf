# Installed as conf.d/bookmyvilla.conf inside the shared gateway container.
# It only adds server blocks for *.bookmyvilla.online; the gateway's own sites
# are untouched. Certificates are copied into /etc/nginx/bookmyvilla/ in the
# same container, so recreating the container drops both together.
# __UPSTREAM__ is replaced by scripts/configure-public-site.sh.
server {
    listen 80;
    server_name bookmyvilla.online api.bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online dataentry.bookmyvilla.online villamanage.bookmyvilla.online;

    location /.well-known/acme-challenge/ {
        proxy_pass http://__UPSTREAM__:8090;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bookmyvilla.online api.bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online dataentry.bookmyvilla.online villamanage.bookmyvilla.online;
    ssl_certificate /etc/nginx/bookmyvilla/fullchain.pem;
    ssl_certificate_key /etc/nginx/bookmyvilla/privkey.pem;

    client_max_body_size 55m;
    location / {
        proxy_pass http://__UPSTREAM__:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
