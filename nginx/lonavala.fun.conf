# ==============================================================================
# MAHABALESHWAR / LONAVALA.FUN - NGINX SUBDOMAIN & STATIC PRODUCTION ROUTING
# ==============================================================================

# ==============================================================================
# HTTP SERVER BLOCKS (Port 80)
# ==============================================================================

# Main Tourist Site & Users (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name lonavala.fun www.lonavala.fun users.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/lonavala.fun/frontend;
    index index.html;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    location /owner/ {
        alias /var/www/lonavala.fun/owner/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /owner/index.html;
    }
    location /caretaker/ {
        alias /var/www/lonavala.fun/caretaker/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /caretaker/index.html;
    }
    location /admin/ {
        alias /var/www/lonavala.fun/admin/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

