# ==============================================================================
# MAHABALESHWAR / LONAVALA.FUN - NGINX SUBDOMAIN CONFIGURATION FOR LIVE LINKS
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block: Certbot ACME Challenge & Automatic HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lonavala.fun www.lonavala.fun users.lonavala.fun owner.lonavala.fun caretaker.lonavala.fun admin.lonavala.fun api.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block: Main Tourist Site (lonavala.fun, www.lonavala.fun)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lonavala.fun www.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/lonavala.fun/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

