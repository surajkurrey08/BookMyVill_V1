# Backend API Proxy Subdomain (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name api.lonavala.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# HTTPS SERVER BLOCKS (Port 443)
# ==============================================================================

# Main Tourist Site & Users (Port 443 SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lonavala.fun www.lonavala.fun users.lonavala.fun;

    ssl_certificate /etc/letsencrypt/live/lonavala.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lonavala.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/lonavala.fun/frontend;
    index index.html;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
