# HTTP configuration used while requesting the first TLS certificate.
server {
    listen 80;
    server_name dataentry.bookmyvilla.online;
    root /var/www/bookmyvilla/data-entry/dist;
    index index.html;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

