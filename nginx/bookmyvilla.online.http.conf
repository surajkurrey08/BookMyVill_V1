# First-deploy HTTP configuration used to issue the TLS certificate.
server {
    listen 80;
    server_name bookmyvilla.online api.bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Certificate setup in progress\n";
    }
}
