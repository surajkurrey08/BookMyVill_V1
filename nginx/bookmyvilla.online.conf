server {
    listen 80;
    server_name bookmyvilla.online api.bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online dataentry.bookmyvilla.online villamanage.bookmyvilla.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bookmyvilla.online;
    ssl_certificate /etc/letsencrypt/live/bookmyvilla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmyvilla.online/privkey.pem;

    root /var/www/bookmyvilla/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name owner.bookmyvilla.online;
    ssl_certificate /etc/letsencrypt/live/bookmyvilla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmyvilla.online/privkey.pem;

    root /var/www/bookmyvilla/owner/dist;
    index index.html;
    location / {
