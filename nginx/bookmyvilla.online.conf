# Host Nginx for BookMyVilla on a private port. Ports 80/443 belong to a shared
# gateway container (another project's Nginx), which terminates TLS for
# *.bookmyvilla.online using nginx/gateway.conf and forwards the traffic here.

# Admin and staff portals must never appear in search results.
map $host $bmv_robots {
    default "";
    ~^(admin|owner|dataentry|villamanage)\. "noindex, nofollow, noarchive";
}

map $host $bookmyvilla_root {
    default                          /var/www/bookmyvilla/frontend/dist;
    bookmyvilla.online               /var/www/bookmyvilla/frontend/dist;
    admin.bookmyvilla.online         /var/www/bookmyvilla/admin/dist;
    owner.bookmyvilla.online         /var/www/bookmyvilla/owner/dist;
    dataentry.bookmyvilla.online     /var/www/bookmyvilla/data-entry/dist;
    villamanage.bookmyvilla.online   /var/www/bookmyvilla/villa-manager/dist;
}

server {
    listen 8090;
    server_name bookmyvilla.online admin.bookmyvilla.online owner.bookmyvilla.online dataentry.bookmyvilla.online villamanage.bookmyvilla.online;

    # Only the gateway container (Docker bridge) and the host may connect.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root $bookmyvilla_root;
    index index.html;
    # Never put this private port (8090) into a redirect address sent to visitors.
    absolute_redirect off;
    add_header X-Robots-Tag $bmv_robots always;

    # Live sitemap from the backend (lists every live villa); falls back to the static file.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:2001/api/admin/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
    }
    location @static_sitemap {
        try_files /sitemap.xml =404;
    }

    # Logged-in and checkout pages are not for search engines.
    location ~ ^/(signin|login|register|owner-setup|register-property|partner-inquiry|admin|owner|owner-dashboard|booking|dashboard|profile|caretaker-apply|caretaker-dashboard|quote|trips)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}

server {
    listen 8090;
    server_name api.bookmyvilla.online;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 55m;
    location / {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The gateway sets X-Real-IP to the real client address. The backend
        # trusts only loopback, so pass the client IP as the sole hop.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
