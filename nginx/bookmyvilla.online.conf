    }
}

server {
    listen 443 ssl;
    server_name admin.bookmyvilla.online;
    ssl_certificate /etc/letsencrypt/live/bookmyvilla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmyvilla.online/privkey.pem;

    root /var/www/bookmyvilla/admin/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.bookmyvilla.online;
    ssl_certificate /etc/letsencrypt/live/bookmyvilla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmyvilla.online/privkey.pem;

    client_max_body_size 55m;
    location / {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

